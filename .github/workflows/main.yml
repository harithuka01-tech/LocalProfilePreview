name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find and extract Android project
        run: |
          mkdir -p project

          unzip -o LocalProfilePreview_AndroidStudio.zip -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | sort

      - name: Detect project directory
        id: project
        run: |
          PROJECT_DIR=$(find project -name "settings.gradle.kts" -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > "${{ steps.project.outputs.project_dir }}/gradle.properties"
          echo "android.enableJetifier=true" >> "${{ steps.project.outputs.project_dir }}/gradle.properties"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: |
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalProfilePreview-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
